# Pre-commit hooks for ibkr-fa.
# See https://pre-commit.com/ for usage.
# Run `uv run pre-commit install` once after cloning, then hooks fire on every commit.

minimum_pre_commit_version: "4.6.0"
default_language_version:
  python: python3.12

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: trailing-whitespace
      - id: detect-private-key
      - id: forbid-submodules

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff-check
        args: ["--fix", "--exit-non-zero-on-fix"]
      - id: ruff-format

  - repo: local
    hooks:
      - id: ty-check
        name: ty (Astral type checker)
        entry: uv run ty check
        language: system
        types: [python]
        pass_filenames: false
